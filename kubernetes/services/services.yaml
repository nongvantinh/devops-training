apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: coffeeshop
  labels:
    app: postgres
spec:
  type: ClusterIP
  ports:
  - port: 5432
    targetPort: 5432
    protocol: TCP
    name: postgres
  selector:
    app: postgres
---
apiVersion: v1
kind: Service
metadata:
  name: rabbitmq
  namespace: coffeeshop
  labels:
    app: rabbitmq
spec:
  type: ClusterIP
  ports:
  - port: 5672
    targetPort: 5672
    protocol: TCP
    name: amqp
  - port: 15672
    targetPort: 15672
    protocol: TCP
    name: management
  selector:
    app: rabbitmq
---
apiVersion: v1
kind: Service
metadata:
  name: product
  namespace: coffeeshop
  labels:
    app: product
spec:
  type: ClusterIP
  ports:
  - port: 5001
    targetPort: 5001
    protocol: TCP
    name: grpc
  selector:
    app: product
---
apiVersion: v1
kind: Service
metadata:
  name: counter
  namespace: coffeeshop
  labels:
    app: counter
spec:
