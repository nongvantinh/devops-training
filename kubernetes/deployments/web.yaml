apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: coffeeshop
  labels:
    app: web
spec:
  replicas: 2
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      containers:
      - name: web
        image: ghcr.io/nongvantinh/go-coffeeshop-web:latest
        ports:
        - containerPort: 8888
          name: http
        env:
        - name: REVERSE_PROXY_URL
          value: "proxy:5000"
        - name: WEB_PORT
          value: "8888"
        livenessProbe:
          httpGet:
            path: /health
            port: 8888
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: 8888
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "200m"
      initContainers:
      - name: wait-for-proxy
        image: busybox:1.35
        command: ['sh', '-c', 'until nc -z proxy 5000; do echo waiting for proxy; sleep 2; done;']
