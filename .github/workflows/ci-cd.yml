name: CoffeeShop CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

env:
  AWS_REGION: us-west-2
  EKS_CLUSTER_NAME: coffeeshop-prod
  ECR_REGISTRY: ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.us-west-2.amazonaws.com

jobs:
  security-scan:
    name: Security Scan with Trivy
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [web, proxy, product, counter, barista, kitchen]
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ env.AWS_REGION }}

    - name: Login to Amazon ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v2

    - name: Pull and scan Docker image with Trivy
      run: |
        # Pull the original image
        docker pull ghcr.io/nongvantinh/go-coffeeshop-${{ matrix.service }}:latest
        
        # Run Trivy scan
        docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
          -v ${{ github.workspace }}:/workspace \
          aquasec/trivy:latest image \
          --format sarif \
          --output /workspace/trivy-results-${{ matrix.service }}.sarif \
          ghcr.io/nongvantinh/go-coffeeshop-${{ matrix.service }}:latest
        
        # Run Trivy scan for critical vulnerabilities
        docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
          aquasec/trivy:latest image \
          --severity CRITICAL,HIGH \
          --exit-code 1 \
          ghcr.io/nongvantinh/go-coffeeshop-${{ matrix.service }}:latest

    - name: Upload Trivy scan results to GitHub Security tab
      uses: github/codeql-action/upload-sarif@v3
      if: always()
      with:
        sarif_file: trivy-results-${{ matrix.service }}.sarif

  build-and-push:
    name: Build and Push to ECR
    runs-on: ubuntu-latest
    needs: security-scan
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'
    strategy:
      matrix:
        service: [web, proxy, product, counter, barista, kitchen]
    outputs:
      image-tag: ${{ steps.meta.outputs.tags }}
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ env.AWS_REGION }}

    - name: Login to Amazon ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v2

    - name: Extract metadata
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ env.ECR_REGISTRY }}/coffeeshop-prod/go-coffeeshop-${{ matrix.service }}
        tags: |
          type=ref,event=branch
          type=ref,event=pr
          type=sha,prefix={{branch}}-
          type=raw,value=latest,enable={{is_default_branch}}

    - name: Pull, tag and push image
      run: |
        # Pull the original image
        docker pull ghcr.io/nongvantinh/go-coffeeshop-${{ matrix.service }}:latest
        
        # Tag for ECR
        docker tag ghcr.io/nongvantinh/go-coffeeshop-${{ matrix.service }}:latest \
          ${{ env.ECR_REGISTRY }}/coffeeshop-prod/go-coffeeshop-${{ matrix.service }}:${{ github.sha }}
        
        docker tag ghcr.io/nongvantinh/go-coffeeshop-${{ matrix.service }}:latest \
          ${{ env.ECR_REGISTRY }}/coffeeshop-prod/go-coffeeshop-${{ matrix.service }}:latest
        
        # Push to ECR
        docker push ${{ env.ECR_REGISTRY }}/coffeeshop-prod/go-coffeeshop-${{ matrix.service }}:${{ github.sha }}
        docker push ${{ env.ECR_REGISTRY }}/coffeeshop-prod/go-coffeeshop-${{ matrix.service }}:latest

  deploy-to-k8s:
    name: Deploy to Kubernetes
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.ref == 'refs/heads/main'
    environment: production
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ env.AWS_REGION }}

    - name: Update kubeconfig
      run: |
        aws eks update-kubeconfig --region ${{ env.AWS_REGION }} --name ${{ env.EKS_CLUSTER_NAME }}

    - name: Deploy to Kubernetes
      run: |
        # Update image tags in deployment files
        sed -i "s|ghcr.io/nongvantinh/go-coffeeshop-|${{ env.ECR_REGISTRY }}/coffeeshop-prod/go-coffeeshop-|g" kubernetes/deployments/*.yaml
        sed -i "s|:latest|:${{ github.sha }}|g" kubernetes/deployments/*.yaml
        
        # Apply Kubernetes manifests
        kubectl apply -f kubernetes/namespace.yaml
        kubectl apply -f kubernetes/secrets.yaml
        kubectl apply -f kubernetes/configmaps.yaml
        kubectl apply -f kubernetes/deployments/
        kubectl apply -f kubernetes/services/
        kubectl apply -f kubernetes/ingress.yaml
        kubectl apply -f kubernetes/hpa.yaml
        
        # Wait for deployment to complete
        kubectl rollout status deployment/web -n coffeeshop --timeout=300s
        kubectl rollout status deployment/proxy -n coffeeshop --timeout=300s
        kubectl rollout status deployment/product -n coffeeshop --timeout=300s
        kubectl rollout status deployment/counter -n coffeeshop --timeout=300s

    - name: Verify deployment
      run: |
        kubectl get pods -n coffeeshop
        kubectl get services -n coffeeshop
        kubectl get ingress -n coffeeshop

  notify:
    name: Notify Deployment Status
    runs-on: ubuntu-latest
    needs: [security-scan, build-and-push, deploy-to-k8s]
    if: always()
    steps:
    - name: Notify Success
      if: needs.deploy-to-k8s.result == 'success'
      run: |
        echo "✅ Deployment successful!"
        echo "Application is now available at the load balancer endpoint"

    - name: Notify Failure
      if: needs.deploy-to-k8s.result == 'failure' || needs.build-and-push.result == 'failure' || needs.security-scan.result == 'failure'
      run: |
        echo "❌ Deployment failed!"
        echo "Check the logs for more details"
